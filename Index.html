<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haz tu pedido</title>
<style>
:root{--bg:#fbfaf6;--c:#fff;--t:#1f1d1b;--m:#6b665e;--a:#f2b705;--g:#2f6b3a;--b:#e4e0d4}
@media(prefers-color-scheme:dark){:root{--bg:#171614;--c:#23211e;--t:#f3f0e8;--m:#a8a296;--b:#3a3731}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif;padding-bottom:120px}
header{background:#1f1d1b;color:#fff;padding:22px 16px;border-bottom:6px solid var(--a)}
h1{margin:0;font-size:26px}header p{margin:4px 0 0;color:#cfc9bb}
main{max-width:640px;margin:auto;padding:16px}
label{font-weight:600;display:block;margin:0 0 6px}
input{width:100%;padding:12px;font-size:16px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);margin-bottom:18px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--c);border:1px solid var(--b);border-radius:8px;margin-bottom:8px}
.it small{color:var(--m)}
.q{display:flex;align-items:center;gap:12px}.q span{min-width:20px;text-align:center;font-weight:700}
.q button{width:40px;height:40px;border-radius:50%;border:0;background:var(--a);color:#1f1d1b;font-size:22px;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--g);outline-offset:2px}
#res{margin-top:22px;padding:14px;background:var(--c);border:1px solid var(--b);border-radius:8px}
#res div{display:flex;justify-content:space-between;padding:4px 0}
.tot{border-top:1px solid var(--b);margin-top:6px;padding-top:8px!important;font-weight:700;font-size:19px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:var(--c);border-top:1px solid var(--b)}
#env{display:block;width:100%;max-width:608px;margin:auto;padding:15px;font-size:18px;font-weight:700;border:0;border-radius:10px;background:var(--g);color:#fff}
#env:disabled{opacity:.45}
#ok{display:none;text-align:center;padding:60px 20px}#ok h2{font-size:30px;margin:0 0 8px}
#ok button{margin-top:20px;padding:12px 20px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:16px}
</style></head><body>
<header><h1 id="neg">Quesadillas</h1><p>Arma tu pedido y envíalo</p></header>
<main id="form">
  <label for="cli">Tu nombre</label>
  <input id="cli" maxlength="60" placeholder="Ej. Ana" autocomplete="given-name">
  <div id="lista">Cargando menú…</div>
  <div id="res"></div>
  <label for="notas" style="margin-top:18px">Notas (opcional)</label>
  <input id="notas" maxlength="120" placeholder="Ej. sin cebolla">
</main>
<main id="ok"><h2>¡Pedido enviado!</h2><p>Tu folio es <b id="folio"></b>. Te llamamos por tu nombre cuando esté listo.</p><button onclick="location.reload()">Hacer otro pedido</button></main>
<div class="bar" id="bar"><button id="env" disabled onclick="enviar()">Enviar pedido</button></div>
<script>
const API=https://script.google.com/macros/s/AKfycbyUN5iqRgzFUyaXmyTyqh41xY5S4nXeh02hy3VU5E6eyk49aDmUNqKPSQDsANPYcImOfg/exec;
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=[],C={};
fetch(API+'?a=productos').then(r=>r.json()).then(d=>{$('neg').textContent=d.negocio||'Quesadillas';document.title=$('neg').textContent;P=d.productos;draw()})
  .catch(()=>$('lista').textContent='No se pudo cargar el menú. Avisa al personal.');
function draw(){
  $('lista').innerHTML=P.map((p,i)=>`<div class="it"><div><b>${esc(p.Nombre)}</b><br><small>$${p.Precio}</small></div>
  <div class="q"><button aria-label="Quitar" onclick="mv(${i},-1)">−</button><span>${C[p.Nombre]||0}</span><button aria-label="Agregar" onclick="mv(${i},1)">+</button></div></div>`).join('');
  const l=P.filter(p=>C[p.Nombre]);let t=0;
  $('res').innerHTML=l.length?'<b>Tu pedido</b>'+l.map(p=>{const s=C[p.Nombre]*p.Precio;t+=s;return`<div><span>${C[p.Nombre]} × ${esc(p.Nombre)}</span><span>$${s}</span></div>`}).join('')+`<div class="tot"><span>Total</span><span>$${t}</span></div>`:'Aún no has elegido nada.';
  $('env').disabled=!l.length;
}
function mv(i,n){const k=P[i].Nombre;C[k]=Math.max(0,(C[k]||0)+n);draw()}
async function enviar(){
  const cliente=$('cli').value.trim();
  if(!cliente){alert('Escribe tu nombre');$('cli').focus();return}
  $('env').disabled=true;$('env').textContent='Enviando…';
  const items=P.filter(p=>C[p.Nombre]).map(p=>({producto:p.Nombre,cantidad:C[p.Nombre]}));
  try{
    const r=await (await fetch(API,{method:'POST',body:JSON.stringify({accion:'crear',cliente,notas:$('notas').value,items})})).json();
    if(r.error)throw new Error(r.error);
    $('form').style.display='none';$('bar').style.display='none';$('ok').style.display='block';$('folio').textContent='#'+r.id;
  }catch(e){alert('No se pudo enviar: '+e.message);$('env').disabled=false;$('env').textContent='Enviar pedido'}
}
</script></body></html>
