<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard de ventas</title>
<style>
:root{--bg:#fbfaf6;--c:#fff;--t:#1f1d1b;--m:#6b665e;--a:#f2b705;--g:#2f6b3a;--b:#e4e0d4}
@media(prefers-color-scheme:dark){:root{--bg:#171614;--c:#23211e;--t:#f3f0e8;--m:#a8a296;--b:#3a3731;--g:#58a866}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif}
header{background:#1f1d1b;color:#fff;padding:16px;border-bottom:6px solid var(--a)}h1{margin:0;font-size:22px}
main{max-width:760px;margin:auto;padding:16px}
input,button{padding:10px;font-size:16px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t)}
button{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.f{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}.f label{display:block;font-size:14px;color:var(--m)}
.k{display:flex;gap:12px;margin-bottom:16px}.k div{flex:1;background:var(--c);border:1px solid var(--b);border-radius:8px;padding:14px}
.k b{display:block;font-size:28px}.k span{color:var(--m)}
h2{font-size:18px;margin:22px 0 8px}
.r{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;padding:4px 0}
.r.p{grid-template-columns:130px 1fr 90px}
.bar{height:16px;background:var(--b);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.r em{font-style:normal;text-align:right;font-weight:600}
#lg{max-width:320px;margin:80px auto;padding:0 16px}#lg input{width:100%;margin:10px 0}#lg button{width:100%}
#err{color:#b3261e}
</style></head><body>
<header><h1>Ventas</h1></header>
<div id="lg"><h2>Ingresa tu PIN</h2><input id="pin" type="password" inputmode="numeric" autocomplete="off"><button onclick="entrar()">Entrar</button><p id="err"></p></div>
<main id="app" style="display:none">
  <div class="f">
    <div><label for="d1">Desde</label><input type="date" id="d1"></div>
    <div><label for="d2">Hasta</label><input type="date" id="d2"></div>
    <button onclick="cargar()">Filtrar</button>
  </div>
  <div class="k"><div><b id="kt">$0</b><span>Ventas</span></div><div><b id="kp">0</b><span>Pedidos</span></div><div><b id="kg">$0</b><span>Pedido promedio</span></div></div>
  <h2>Ventas por día</h2><div id="dias"></div>
  <h2>Productos más vendidos</h2><div id="prods"></div>
</main>
<script>
const API=https://script.google.com/macros/s/AKfycbyUN5iqRgzFUyaXmyTyqh41xY5S4nXeh02hy3VU5E6eyk49aDmUNqKPSQDsANPYcImOfg/exec;
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let PIN=sessionStorage.getItem('pin')||'';
const hoy=new Date();$('d2').value=hoy.toLocaleDateString('sv');
hoy.setDate(hoy.getDate()-6);$('d1').value=hoy.toLocaleDateString('sv');
$('pin').addEventListener('keydown',e=>e.key==='Enter'&&entrar());
function entrar(){PIN=$('pin').value;cargar()}
async function cargar(){
  try{
    const d=await (await fetch(`${API}?a=dashboard&pin=${encodeURIComponent(PIN)}&desde=${$('d1').value}&hasta=${$('d2').value}`)).json();
    if(d.error){sessionStorage.removeItem('pin');$('lg').style.display='block';$('app').style.display='none';$('err').textContent=PIN?d.error:'';return}
    sessionStorage.setItem('pin',PIN);$('lg').style.display='none';$('app').style.display='block';
    $('kt').textContent='$'+d.total;$('kp').textContent=d.pedidos;$('kg').textContent='$'+(d.pedidos?Math.round(d.total/d.pedidos):0);
    const mx=Math.max(1,...d.dias.map(x=>x.total)),mp=Math.max(1,...d.productos.map(x=>x.cantidad));
    $('dias').innerHTML=d.dias.map(x=>`<div class="r"><span>${x.fecha}</span><div class="bar"><i style="width:${x.total/mx*100}%"></i></div><em>$${x.total}</em></div>`).join('')||'Sin ventas en este rango.';
    $('prods').innerHTML=d.productos.map(x=>`<div class="r p"><span>${esc(x.producto)}</span><div class="bar"><i style="width:${x.cantidad/mp*100}%"></i></div><em>${x.cantidad} pzas</em></div>`).join('')||'Sin ventas en este rango.';
  }catch(e){$('err').textContent='No se pudo conectar'}
}
if(PIN)cargar();
</script></body></html>
