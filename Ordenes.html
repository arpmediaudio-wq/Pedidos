<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Órdenes</title>
<style>
:root{--bg:#fbfaf6;--c:#fff;--t:#1f1d1b;--m:#6b665e;--a:#f2b705;--g:#2f6b3a;--r:#b3261e;--b:#e4e0d4}
@media(prefers-color-scheme:dark){:root{--bg:#171614;--c:#23211e;--t:#f3f0e8;--m:#a8a296;--b:#3a3731;--g:#58a866;--r:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif}
header{background:#1f1d1b;color:#fff;padding:14px 16px;border-bottom:6px solid var(--a);display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}header span{color:#cfc9bb;font-size:14px}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;padding:12px}
.o{background:var(--c);border:1px solid var(--b);border-left:6px solid var(--a);border-radius:8px;padding:12px}
.o.listo{border-left-color:var(--g)}.o.fin{opacity:.55}
.h{display:flex;justify-content:space-between;align-items:baseline}.h b{font-size:19px}.h small{color:var(--m)}
ul{margin:8px 0;padding-left:18px}
.tot{font-size:22px;font-weight:700;margin:6px 0}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:99px;border:1px solid var(--b);margin-right:4px}
.pg{color:var(--g);border-color:var(--g)}.np{color:var(--r);border-color:var(--r)}
.bt{display:flex;gap:6px;margin-top:8px}
button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:15px;font-weight:600}
button.p{background:var(--g);border-color:var(--g);color:#fff}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
dialog{border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);width:min(420px,92vw);max-height:85vh}
.it{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.it span{display:flex;gap:10px;align-items:center}.it button{width:36px;flex:none;padding:6px}
</style></head><body>
<header><h1>Órdenes de hoy</h1><span id="info">Cargando…</span></header>
<div id="g"></div>
<dialog id="dlg"><h3 id="dt" style="margin-top:0"></h3><div id="dl"></div>
<div class="bt"><button onclick="dlg.close()">Cancelar</button><button class="p" onclick="guardar()">Agregar al pedido</button></div></dialog>
<script>
const API=https://script.google.com/macros/s/AKfycbyUN5iqRgzFUyaXmyTyqh41xY5S4nXeh02hy3VU5E6eyk49aDmUNqKPSQDsANPYcImOfg/exec;
const $=i=>document.getElementById(i),dlg=$('dlg');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=[],O=[],A=null,Q={},ultimo=0;
const post=o=>fetch(API,{method:'POST',body:JSON.stringify(o)}).then(r=>r.json());
async function cargar(){
  if(dlg.open)return;
  try{
    if(!P.length)P=(await (await fetch(API+'?a=productos')).json()).productos;
    O=await (await fetch(API+'?a=pedidos')).json();
    pintar();$('info').textContent='Actualizado '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  }catch(e){$('info').textContent='Sin conexión…'}
}
function pintar(){
  const rank=o=>o.estado==='Entregado'&&o.pagado==='SI'?2:o.estado==='Entregado'?1:0;
  const l=[...O].sort((a,b)=>rank(a)-rank(b)||a.id-b.id);
  const n=l.filter(o=>o.estado!=='Entregado').length;
  if(n>ultimo&&ultimo>=0&&window._ok)try{new AudioContext().resume();navigator.vibrate&&navigator.vibrate(200)}catch(e){}
  ultimo=n;window._ok=true;
  $('g').innerHTML=l.length?l.map(o=>`<div class="o ${o.estado==='Entregado'?'listo':''} ${rank(o)==2?'fin':''}">
  <div class="h"><b>#${o.id} ${esc(o.cliente)}</b><small>${esc(o.hora)}</small></div>
  <ul>${o.items.map(i=>`<li>${i.cantidad} × ${esc(i.producto)}</li>`).join('')}</ul>
  ${o.notas?`<small>📝 ${esc(o.notas)}</small>`:''}
  <div class="tot">$${o.total}</div>
  <span class="tag">${o.estado}</span><span class="tag ${o.pagado==='SI'?'pg':'np'}">${o.pagado==='SI'?'Pagado':'Por cobrar'}</span>
  <div class="bt">
    ${o.estado!=='Entregado'?`<button onclick="est(${o.id},'Entregado')">Entregar</button>`:''}
    ${o.pagado!=='SI'?`<button class="p" onclick="pag(${o.id})">Liquidar $${o.total}</button>`:''}
    <button onclick="abrir(${o.id})">+ Agregar</button></div></div>`).join(''):'<p style="padding:20px">Aún no hay pedidos hoy.</p>';
}
async function est(id,estado){await post({accion:'estado',id,estado});cargar()}
async function pag(id){await post({accion:'estado',id,pagado:'SI'});cargar()}
function abrir(id){A=O.find(o=>o.id==id);Q={};$('dt').textContent=`Agregar a #${A.id} ${A.cliente}`;lista();dlg.showModal()}
function lista(){$('dl').innerHTML=P.map((p,i)=>`<div class="it"><span>${esc(p.Nombre)} <small>$${p.Precio}</small></span>
<span><button onclick="Q[${i}]=Math.max(0,(Q[${i}]||0)-1);lista()">−</button>${Q[i]||0}<button onclick="Q[${i}]=(Q[${i}]||0)+1;lista()">+</button></span></div>`).join('')}
async function guardar(){
  const items=P.map((p,i)=>({producto:p.Nombre,cantidad:Q[i]||0})).filter(i=>i.cantidad);
  if(!items.length){dlg.close();return}
  await post({accion:'agregar',id:A.id,items});dlg.close();cargar();
}
cargar();setInterval(cargar,8000);
</script></body></html>
